# Configuration Netlify pour Passerelle Environnement
# Ce fichier configure le déploiement automatique sur Netlify

[build]
  # Dossier publié (pour l'instant, c'est la racine)
  publish = "."
  # Pas besoin de build command pour un site statique
  command = ""

[build.processing.html]
  # Pretty URLs de Netlify désactivées volontairement. Cette fonctionnalité (activée par défaut)
  # est censée rediriger proprement /page.html vers /page, mais plusieurs retours d'utilisateurs
  # Netlify (forums officiels, 2020-2026) montrent qu'elle laisse parfois les deux adresses actives
  # sans rediriger l'une vers l'autre. Constaté sur ce site : Google a indexé /article-urbanisme
  # (sans extension) plutôt que /article-urbanisme.html (la version canonique, utilisée par le
  # sitemap et les liens internes), ce qui disperse les signaux de référencement entre deux URL au
  # lieu de les concentrer sur une seule. On désactive ce comportement automatique et on le remplace
  # par une redirection explicite ci-dessous, dont le comportement est prévisible et vérifiable.
  pretty_urls = false

[dev]
  # Port local pour les tests
  port = 8000
  # Dossier à servir en local
  publish = "."

[functions]
  # Fonction serverless : réception des webhooks cal.eu (Booking Paid, Meeting Ended)
  # et envoi des emails transactionnels Brevo. Voir netlify/functions/cal-webhook.js.
  directory = "netlify/functions"

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    # X-XSS-Protection est déprécié (recommandation OWASP Secure Headers) : la CSP ci-dessous
    # le remplace. Valeur "0" plutôt qu'omise pour désactiver explicitement le filtre XSS hérité
    # de certains navigateurs, qui peut lui-même introduire des failles.
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP volontairement permissive sur script-src/style-src 'unsafe-inline' : le site utilise des
    # scripts et styles inline (questionnaire.html notamment) sans build step permettant nonces/hash.
    # Elle bloque en revanche tout chargement de script/frame/objet depuis un domaine tiers non
    # listé. À resserrer (nonces) si le site passe à un build step. À mettre à jour dès l'ajout de
    # Stripe/Cal.com/Brevo embarqués (script-src, frame-src, connect-src, form-action).
    # cloud.umami.is autorisé en script-src (chargement du script) et connect-src (envoi des events).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloud.umami.is; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Cache pour les polices (long terme)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les images
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Rate limiting sur les soumissions de formulaires (contact, rétractation, renonciation).
# Les 3 formulaires Netlify Forms du site postent vers /merci.html. Fonctionnalité disponible
# sur tous les plans Netlify (2 règles max sur les plans Starter/Free) : voir
# https://docs.netlify.com/manage/security/secure-access-to-sites/rate-limiting/
# Complète le honeypot déjà en place (netlify-honeypot="bot-field"), qui ne protège pas contre
# un envoi massif automatisé qui ignorerait simplement le champ piège.
[[redirects]]
  from = "/merci.html"
  to = "/merci.html"
  status = 200
  force = false
  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Redirection générique : toute adresse sans extension (/article-urbanisme, /accompagnement,
# /blog...) renvoie vers sa version .html correspondante avec un vrai code 301 (redirection
# permanente). Objectif : une seule adresse indexable par page, celle déjà utilisée partout ailleurs
# sur le site (sitemap.xml, balises canoniques, liens internes), plutôt que de laisser Google
# arbitrer lui-même entre deux versions selon les pages.
# Sans danger pour les fichiers réels du site (robots.txt, sitemap.xml, favicon...) : Netlify
# donne toujours priorité à un fichier existant sur une redirection quand les deux correspondent
# à la même adresse exacte (comportement par défaut, "force" n'est volontairement pas activé ici).
[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 301
  force = false
